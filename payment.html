<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Payment | KYLO Agric Solution
  </title>

  <meta
    name="description"
    content="Complete your KYLO Agric Solution order payment."
  >

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

<header class="site-header">

  <div class="container nav-wrap">

    <a
      href="index.html"
      class="brand"
    >

      <img
        src="images/kylo-agric-logo.png"
        alt="KYLO Agric Solution logo"
        class="brand-logo"
      >

    </a>


    <button
      class="menu-toggle"
      id="menuToggle"
      aria-label="Open navigation"
    >
      ☰
    </button>


    <nav
      class="main-nav"
      id="mainNav"
    >

      <a href="index.html">
        Home
      </a>

      <a href="products.html">
        Products
      </a>

      <a href="account.html">
        Account
      </a>

    </nav>

  </div>

</header>


<main>

<section class="page-hero">

  <div class="container">

    <h1>
      Complete Payment
    </h1>

    <p>
      Your order has been created successfully.
    </p>

  </div>

</section>


<section class="content-section">

  <div class="container">

    <div
      class="payment-box"
      id="paymentBox"
    >

      <h2>
        Order Created
      </h2>


      <p>

        Order number:

        <strong id="orderNumber">
          Loading...
        </strong>

      </p>


      <p id="paymentMessage">

        Preparing secure payment...

      </p>


      <button
        id="paynowButton"
        class="btn btn-primary"
      >
        Continue to Paynow
      </button>


      <div
        id="paymentError"
        class="alert error"
        style="display:none;"
      ></div>

    </div>

  </div>

</section>

</main>


<footer class="site-footer">

  <div class="container">

    <p>
      © 2026 KYLO Agric Solution.
      All rights reserved.
    </p>

  </div>

</footer>


<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/app.js"></script>


<script>

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    const supabase =
      window.kyloSupabase;

    const params =
      new URLSearchParams(
        window.location.search
      );

    const orderId =
      params.get("order");


    const orderNumber =
      document.getElementById(
        "orderNumber"
      );

    const message =
      document.getElementById(
        "paymentMessage"
      );

    const button =
      document.getElementById(
        "paynowButton"
      );

    const errorBox =
      document.getElementById(
        "paymentError"
      );


    // ================================================
    // ORDER ID
    // ================================================

    if (!orderId) {

      errorBox.style.display =
        "block";

      errorBox.textContent =
        "No order was supplied.";

      button.style.display =
        "none";

      return;

    }


    orderNumber.textContent =
      orderId;


    // ================================================
    // SESSION
    // ================================================

    const {
      data: {
        session
      }
    } =
      await supabase.auth.getSession();


    if (!session) {

      window.location.href =
        `auth.html?redirect=${encodeURIComponent(
          `payment.html?order=${orderId}`
        )}`;

      return;

    }


    // ================================================
    // PAYNOW
    // ================================================

    button.addEventListener(
      "click",
      async () => {

        button.disabled =
          true;

        button.textContent =
          "Connecting to Paynow...";

        errorBox.style.display =
          "none";


        try {

          const {
            data: {
              session
            }
          } =
            await supabase.auth.getSession();


          if (!session) {

            throw new Error(
              "Your session has expired."
            );

          }


          const response =
            await fetch(
              "/api/paynow-create",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "Authorization":
                    `Bearer ${session.access_token}`
                },

                body: JSON.stringify({
                  orderId
                })
              }
            );


          const result =
            await response.json();


          if (!response.ok) {

            throw new Error(
              result.error ||
              "Unable to start payment."
            );

          }


          if (
            !result.redirectUrl
          ) {

            throw new Error(
              "Paynow did not return a payment URL."
            );

          }


          message.textContent =
            "Redirecting you to Paynow...";


          window.location.href =
            result.redirectUrl;


        } catch (error) {

          console.error(error);


          errorBox.style.display =
            "block";

          errorBox.textContent =
            error.message ||
            "Unable to start payment.";


          button.disabled =
            false;

          button.textContent =
            "Try Again";

        }

      }
    );

  }
);

</script>

</body>

</html>
