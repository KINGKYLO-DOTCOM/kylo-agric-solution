<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>My Account | KYLO Agric Solution</title>

    <link
        rel="icon"
        href="images/kylo-agric-logo.png">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>

<div id="toast" class="toast"></div>


<header class="site-header">

    <div class="container nav-wrap">

        <a
            class="brand"
            href="index.html">

            <img
                src="images/kylo-agric-logo.png"
                alt="KYLO Agric Solution">

        </a>


        <button
            id="menuToggle"
            class="menu-toggle">

            ☰

        </button>


        <nav id="siteNav">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="knowledge.html">
                Knowledge Hub
            </a>

            <a href="cart.html">
                Cart
                <span data-cart-count>0</span>
            </a>

        </nav>

    </div>

</header>


<main>

<section class="page-hero">

    <div class="container">

        <span class="eyebrow">
            CUSTOMER AREA
        </span>

        <h1>
            My Account
        </h1>

        <p>
            Manage your account and view your orders.
        </p>

    </div>

</section>


<section class="section">

    <div class="container">


        <div class="dashboard-grid">


            <div class="dashboard-card">

                <h2>
                    Profile
                </h2>

                <div id="profileBox">
                    Loading profile...
                </div>

            </div>


            <div class="dashboard-card">

                <h2>
                    Account
                </h2>

                <button
                    id="signOutBtn"
                    class="btn btn-outline">

                    Sign Out

                </button>

            </div>

        </div>


        <div class="dashboard-card">

            <h2>
                My Orders
            </h2>

            <div id="ordersBox">
                Loading orders...
            </div>

        </div>


    </div>

</section>

</main>


<footer class="footer">

    <div class="footer-bottom">

        © 2026 KYLO Agric Solution.
        All rights reserved.

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/supabase.js"></script>

<script src="js/app.js"></script>

<script src="js/account.js"></script>

</body>

</html>
