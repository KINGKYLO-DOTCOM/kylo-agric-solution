<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | KYLO Agric Solution</title>

    <link
        rel="icon"
        href="images/kylo-agric-logo.png">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>

<div id="toast" class="toast"></div>


<header class="site-header">

    <div class="container nav-wrap">

        <a
            class="brand"
            href="index.html">

            <img
                src="images/kylo-agric-logo.png"
                alt="KYLO Agric Solution">

        </a>


        <button
            id="menuToggle"
            class="menu-toggle">

            ☰

        </button>


        <nav id="siteNav">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="account.html">
                Account
            </a>

            <a href="enquiry.html">
                Enquire
            </a>

        </nav>

    </div>

</header>


<main>

<section class="page-hero">

    <div class="container">

        <span class="eyebrow">
            YOUR ORDER
        </span>

        <h1>
            Shopping Cart
        </h1>

        <p>
            Review your selected agricultural products.
        </p>

    </div>

</section>


<section class="section">

    <div class="container cart-layout">


        <div>

            <div
                id="cartItems"
                class="cart-items">

            </div>

        </div>


        <aside class="cart-summary">

            <h2>
                Order Summary
            </h2>

            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong id="cartSubtotal">
                    $0.00
                </strong>

            </div>


            <div class="summary-row">

                <span>
                    Delivery
                </span>

                <strong>
                    Calculated manually
                </strong>

            </div>


            <hr>


            <div class="summary-total">

                <span>
                    Total
                </span>

                <strong id="cartTotal">
                    $0.00
                </strong>

            </div>


            <a
                href="checkout.html"
                class="btn btn-primary full-width">

                Proceed to Checkout

            </a>


            <a
                href="products.html"
                class="btn btn-outline full-width">

                Continue Shopping

            </a>

        </aside>


    </div>

</section>

</main>


<footer class="footer">

    <div class="footer-bottom">

        © 2026 KYLO Agric Solution.
        All rights reserved.

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/supabase.js"></script>

<script src="js/app.js"></script>

<script src="js/cart.js"></script>

</body>

</html>
